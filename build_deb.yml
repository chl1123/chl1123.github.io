PackageID: behav-led-py
version: 2026.05.28.094811 #可以不传，默认用当前时间戳
description: behav_led hotfix
node: master
arch:
  - arm64 # 可选：arm64, amd64，all(roboshop有的版本不一定支持all)

files:
  - type: script
    source: ./syspy/behavs/rpc.py # 本地文件路径
    # target 可省略。script 缺省时会直接使用 source 的相对路径
  - type: script
    source: ./generic/v3/led/standard/behav_led.py
    # target 可省略。generic/tasks 下会自动去掉 v3/v4 这一层
    # 上面的 source 最终会落到:
    # /opt/.data/rbk/resources/scripts/generic/led/standard/behav_led.py

  # - type: lib
  #   source: /absolute/path/to/your/libdemo.so
  #   target: plugins/libdemo.so # lib 必须显式指定 target, 基于 /opt/data/rbk/ + target 拼接
  #   target: lib/libdemo.so
  #   target: 3rdlibs/libdemo.so
  #   target: tools/libdemo.so
